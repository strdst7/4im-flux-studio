name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the solver package
        run: npm run build:fluid

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate presets
        run: node packages/cli/bin/flux.mjs validate

  studio:
    name: build studio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build static export
        run: npm run build -w @4im/studio
        env:
          STATIC_EXPORT: "1"

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: studio-static
          path: apps/studio/out
          retention-days: 7

  core-drift:
    name: solver core is reproducible
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the core from the vendored upstream script
        run: node packages/fluid/src/core/build-core.mjs

      - name: Fail if the committed core is stale
        run: |
          if ! git diff --quiet -- packages/fluid/src/core/fluid.core.js; then
            echo "::error::packages/fluid/src/core/fluid.core.js is out of date."
            echo "Run 'npm run core -w @4im/fluid' and commit the result."
            git diff --stat -- packages/fluid/src/core/fluid.core.js
            exit 1
          fi
          echo "core is up to date"
