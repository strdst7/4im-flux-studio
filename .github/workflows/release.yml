name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: cut release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify before publishing anything
        run: npm run verify

      - name: Build static studio
        run: npm run build -w @4im/studio
        env:
          STATIC_EXPORT: "1"

      - name: Package the static site
        run: |
          cd apps/studio
          tar -czf ../studio-${{ github.ref_name }}.tar.gz -C out .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/studio/studio-${{ github.ref_name }}.tar.gz
          body: |
            4IM/Flux ${{ github.ref_name }}

            The attached archive is the studio as static files — unpack it and
            serve the directory from any host. No server, no build step.
